# Server Configuration
server.port=8080

# Database Configuration
# Defaults to file-based persistent storage in ./data/secure_vault (compatible with MySQL mode)
# Override via environment variables for external MySQL server
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/secure_vault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configurations (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Configuration
file.storage.location=./storage

# Firebase Configuration
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project.id=${FIREBASE_PROJECT_ID:vault-b07bd}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173,null}
