<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/page-guard.js"></script>
    <!-- Firebase App & Auth SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Secure Vault</span>
                </a>
                <p>Enter your email to receive a Firebase password reset link.</p>
            </div>
            
            <div id="form-error" style="display: none; background-color: rgba(231, 76, 60, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 20px; text-align: center;"></div>
            <div id="form-info" style="display: none; background-color: rgba(52, 152, 219, 0.15); color: var(--info); border: 1px solid var(--info); padding: 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 20px; text-align: center;"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-paper-plane"></i> <span id="btn-text">Send Reset Email</span>
                </button>
            </form>
            
            <div class="form-footer">
                Back to <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgot-form');
        const errorDiv = document.getElementById('form-error');
        const infoDiv = document.getElementById('form-info');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            btnSubmit.disabled = true;
            btnText.textContent = 'Sending...';

            const email = document.getElementById('email').value.trim();

            try {
                const response = await sv_forgotPassword(email);
                infoDiv.textContent = response.message || 'If an account exists for this email, Firebase has dispatched password reset instructions.';
                infoDiv.style.display = 'block';
                forgotForm.reset();
            } catch (err) {
                errorDiv.textContent = err.message || 'Unable to process reset request.';
                errorDiv.style.display = 'block';
            } finally {
                btnSubmit.disabled = false;
                btnText.textContent = 'Send Reset Email';
            }
        });
    </script>
</body>
</html>
