<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/page-guard.js"></script>
    <!-- Firebase App & Auth SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="topbar-container"></div>
            <div class="content-body">
                <div style="margin-bottom: 25px;">
                    <h2 style="font-size: 1.6rem; font-weight: 700; color: white;">Infrastructure Diagnostics</h2>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Real-time health of application servers, MySQL storage, and file subsystems.</p>
                </div>

                <div class="stats-grid" id="infra-cards-grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 30px;">
                    <div class="stat-card" style="padding: 20px;">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Checking infrastructure services...
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
