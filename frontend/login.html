<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/page-guard.js"></script>
    <!-- Firebase App & Auth SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Secure Vault</span>
                </a>
                <p>Welcome back! Authenticate with Firebase to enter your vault.</p>
            </div>

            <div id="form-error"
                style="display: none; background-color: rgba(231, 76, 60, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 20px; text-align: center;">
            </div>

            <!-- Google One-Click Login -->
            <button type="button" id="btn-google" class="btn btn-secondary"
                style="width: 100%; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; border-color: rgba(255,255,255,0.15);">
                <i class="fa-brands fa-google" style="color: #4285F4; font-size: 1.1rem;"></i>
                <span>Sign In with Google</span>
            </button>

            <div
                style="display: flex; align-items: center; text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 0.8rem;">
                <div style="flex: 1; border-bottom: 1px solid var(--border-color);"></div>
                <span style="padding: 0 10px;">or with email</span>
                <div style="flex: 1; border-bottom: 1px solid var(--border-color);"></div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye-slash input-icon-right" id="toggle-password"></i>
                    </div>
                </div>
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 0.85rem;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer;">
                        <input type="checkbox" id="remember-me" style="cursor: pointer;"> Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-right-to-bracket"></i> <span id="btn-text">Sign In</span>
                </button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Sign up </a>
            </div>

            <div
                style="margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color); font-size: 0.8rem; text-align: center; color: var(--text-muted);">
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('form-error');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnGoogle = document.getElementById('btn-google');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            btnSubmit.disabled = true;
            btnText.textContent = 'Authenticating...';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            try {
                await sv_login(email, password);
            } catch (err) {
                errorDiv.textContent = err.message || 'Invalid email or password.';
                errorDiv.style.display = 'block';
                btnSubmit.disabled = false;
                btnText.textContent = 'Sign In';
            }
        });

        btnGoogle.addEventListener('click', async () => {
            errorDiv.style.display = 'none';
            try {
                await sv_googleLogin();
            } catch (err) {
                errorDiv.textContent = err.message || 'Google sign in failed.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
